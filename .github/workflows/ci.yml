name: Makam CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# En az ayrıcalık ilkesi: hiçbir job repo içeriğini okumaktan fazlasına
# ihtiyaç duymuyor (PR/issue yorumu yazma, paket yayınlama vb. yok) — bu
# olmadan GITHUB_TOKEN varsayılan izinleri repo/org ayarına bağlı kalıyordu
# (bkz. kod denetimi).
permissions:
  contents: read

# main push'ları kuyruklanır (cancel-in-progress: false) — deploy'u ortasında
# kesmek daha kötü olurdu, bu yüzden art arda push'lar sırayla biter ve en son
# yayınlanan release her zaman en yeni commit olur (sırası bozuk deploy
# imkânsız hale gelir, bkz. kod denetimi). PR'larda ise aynı PR'a art arda
# push'ta eski koşu iptal edilir — e2e.yml'deki desenle tutarlı.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  # firebase-tools'un `latest`i her deploy'da yeniden kurmak yerine pinlenmiş
  # bir sürüm kullanılıyor — hem tekrarlanabilirlik (bozuk bir upstream
  # sürümü production deploy'unu habersiz kırmasın) hem de npm cache'in bu
  # sürüme kilitlenebilmesi için (bkz. deploy/preview job'larındaki cache adımı).
  FIREBASE_TOOLS_VERSION: '15.30.1'

jobs:
  # ─── 0. Güvenlik Taraması ────────────────────────────────────────────────────
  security:
    name: Güvenlik Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Gizli Anahtar Taraması (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # `npm audit` package-lock.json'daki bağımlılık ağacını denetler, kurulu
      # node_modules gerektirmez — `npm ci` burada gereksiz bir 12 sn'lik
      # beklemeydi (doğrulandı: node_modules'suz bir dizinde aynı audit
      # komutu aynı sonucu veriyor).
      - name: Bağımlılık Güvenlik Denetimi (production — bloklayıcı)
        # Yalnızca PRODUCTION bağımlılıkları (--omit=dev) client bundle'a
        # girer/sunucuya deploy edilir; bu ağaçta bugün itibarıyla 0 açık var
        # (doğrulandı: `npm audit --omit=dev --audit-level=high`). Eşik
        # `high`a çekildi — önceden `critical` idi ve gerçek "high" seviye
        # bulguları (aşağıya bkz.) hiç yakalamıyordu (bkz. kod denetimi).
        run: npm audit --omit=dev --audit-level=high

      - name: Bağımlılık Güvenlik Denetimi (devDependencies — bilgilendirici)
        # Kalan tüm bilinen açıklar (17 adet) yalnızca devDependencies'te:
        # firebase-admin→google-gax→uuid (scripts/seedE2E.ts, emulator seed)
        # ve @lhci/cli→lighthouse→puppeteer→{tmp,extract-zip} (yalnızca CI'da
        # çalışan Lighthouse aracı). Hiçbiri build çıktısına veya sunucuya
        # taşınmıyor. Düzeltmeleri şu an yalnızca `npm audit fix --force` ile
        # (büyük breaking-change, @lhci/cli@0.1.0'a düşürüyor) mümkün, bu
        # yüzden bloklayıcı yapılmadı — ama `continue-on-error` ile CI
        # loglarında görünür kalır ki yeni bir açık sessizce birikmesin.
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── 1. Kod Kalitesi ve Test ────────────────────────────────────────────────
  quality:
    name: Kalite Kontrolü
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Kontrol (Lint)
        run: npm run lint

      - name: ESLint (kod kalitesi, a11y, Firestore rules)
        run: npm run eslint

      - name: Testler + Kapsam Eşikleri (src/lib + src/services)
        # `npm test` (vitest run) ayrı bir adım olarak KOŞULMUYOR — aynı test
        # kümesini `npm run test:coverage` (vitest run --coverage) zaten
        # koşuyor ve üstüne vite.config.ts'teki coverage.thresholds'u da
        # uyguluyor (bkz. kod denetimi: önceden eşiksizdi VE continue-on-error
        # ile CI'ı hiç kıramıyordu — kapsam zamanla sessizce erozyona
        # uğrayabiliyordu). İki adımı ayrı tutmak testleri iki kez koşturup
        # kritik yola ~31 sn gereksiz ekliyordu.
        run: npm run test:coverage

      - name: Kapsam Raporunu Kaydet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── 2. Production Build ────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    # BİLİNÇLİ OLARAK `quality`/`security`'ye needs YOK — build bunlarla
    # PARALEL başlar (kritik yolda ~46 sn kazandırır, repo public olduğu için
    # quality/security başarısız olsa bile build'in boşuna koşması bedava).
    # Bu paralelleştirmenin güvenlik kilidi aşağıdaki `deploy`/`preview`
    # job'larının `needs` listesindedir — quality/security oradan tekrar
    # zorunlu kılınıyor, aksi halde testi kırık kod production'a çıkardı.

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Build Artifaktını Kaydet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── 2b. Performans Bütçeleri (bundle boyutu + Lighthouse) ─────────────────
  performance:
    name: Performans Bütçeleri
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js ${{ env.NODE_VERSION }} Kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # `shell: bash` burada zorunlu: pipefail'i açar, aksi halde `tee`
      # boru zincirinin son komutu olduğu için size-limit limit aşımıyla
      # başarısız olsa bile adımın kendisi (varsayılan GitHub bash'inde
      # pipefail kapalı olduğundan) yeşil görünürdü — bütçe kapısı sessizce
      # devre dışı kalırdı. `npm run size` YERİNE doğrudan `npx size-limit`
      # çağrılıyor: `npm run` Linux runner'larda "> makam-app@2.3.0 size"
      # banner satırlarını STDOUT'a yazıyor (bkz. kod denetimi — ilk canlı
      # koşuda bu satırlar size-limit-result.json'a karışıp jq'yu
      # "Invalid numeric literal" ile patlatmıştı) — `npx` bu npm-script
      # yaşam döngüsünü baypas ettiği için çıktı temiz JSON kalır.
      - name: Bundle Boyutu Bütçesi
        shell: bash
        run: npx size-limit --json | tee size-limit-result.json

      # Best-effort özet: JSON şeması değişirse bu adım (`|| true`) performans
      # job'unu KIRMAZ — bütçe kapısının kendisi zaten önceki adımda uygulandı.
      - name: Bundle Boyutu Özeti
        if: always()
        run: |
          {
            echo "## 📦 Bundle Boyutu Özeti"
            echo ""
            echo "| Paket | Boyut (gzip) | Limit | Durum |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.name) | \((.size/1024*100|round)/100) KB | \((.sizeLimit/1024*100|round)/100) KB | \(if .passed then "✅" else "❌" end) |"' size-limit-result.json
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Lighthouse CI (a11y, best-practices, SEO, perf)
        # NOT: accessibility/best-practices/seo "error" seviyesinde gerçek bir
        # kapı — build'i kırar. performance şimdilik "warn" (bkz. lighthouserc.json):
        # mevcut skor (~0.57) büyük ölçüde firebase/pdf/chart vendor paketlerinden
        # kaynaklanıyor ve ayrı bir bundle-optimizasyon çalışması gerektiriyor.
        run: npm run lighthouse

  # ─── 3. Firebase Hosting Deploy (sadece main branch) ───────────────────────
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    # `quality`/`security` burada da zorunlu: `build` artık bunlarla paralel
    # koşuyor (bkz. build job'ındaki not), bu yüzden deploy'un kapısı hâlâ
    # tüm dördünün geçmesine bağlı kalsın diye burada açıkça tekrar edilir.
    needs: [security, quality, build, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # `id-token: write` yalnızca WIF ile GCP'ye kimlik doğrulayan bu iki job'da
    # (deploy/preview) açılır — üstteki workflow geneli `contents: read`
    # diğer job'lar için geçerli kalır. Job seviyesi izin bloğu workflow
    # genelini EZER, bu yüzden contents: read burada tekrar yazılıyor.
    permissions:
      contents: read
      id-token: write
    # GitHub'ın native Environments/Deployments geçmişini besler — "şu an
    # production'da ne var" sorusu artık job loglarını kazmadan repo'nun
    # Environments sekmesinden cevaplanabilir.
    environment:
      name: production
      url: https://muftim.web.app

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # Kimlik doğrulama: Workload Identity Federation (anahtarsız). Eskiden
      # `firebase login:ci` ile üretilen kişisel bir FIREBASE_TOKEN kullanılıyordu
      # — 2026-09-12'de token geçersizleşti ("Failed to get Firebase project
      # muftim"), üstelik `--token` firebase-tools'ta deprecated. Servis
      # hesabı JSON ANAHTARI da seçilmedi: anahtar üretimi daha önce GCP
      # kotasına takılmıştı ve anahtar dosyası sızma/rotasyon yükü taşır. WIF'te
      # GitHub'ın kısa ömürlü OIDC token'ı doğrudan servis hesabına eşlenir;
      # saklanan sır yok, süresi dolan şey yok. Bu adım `google-auth-library`nin
      # `external_account` biçiminde bir kimlik dosyası yazıp
      # GOOGLE_APPLICATION_CREDENTIALS'ı ayarlar; firebase-tools (>=13) ADC
      # üzerinden bunu otomatik kullanır. GCP tarafı tek seferlik kurulum:
      # scripts/setup-gcp-wif.sh. Proje hedefi .firebaserc'teki
      # "default": "muftim"'ten geliyor, ayrıca bir PROJECT_ID gerekmiyor.
      - name: GCP Kimlik Doğrulama (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # firebase-tools global npm cache'i sürüme göre anahtarlanır (bkz.
      # workflow env → FIREBASE_TOOLS_VERSION) — pinli sürüm değişmediği
      # sürece sonraki koşular yeniden indirmez.
      - name: firebase-tools Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: firebase-tools-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Firebase CLI Kur
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      # NOT: firestore.rules/firestore.indexes.json eskiden hiç deploy
      # edilmiyordu — yalnızca hosting deploy ediliyordu (bkz. kod denetimi:
      # repo'ya eklenen bir rules/index değişikliği production'a hiç
      # ulaşmıyor, yalnızca manuel `firebase deploy` veya konsol üzerinden
      # taşınabiliyordu). Hosting'den ÖNCE çalışır ki yeni bir rules/index'e
      # bağımlı bir client değişikliği hosting'e çıktığında ilgili rules/index
      # zaten yerinde olsun.
      - name: Firestore Rules & Indexes Deploy Et
        run: firebase deploy --only firestore:rules,firestore:indexes --non-interactive

      # `--json` çıktısı hem bir sonraki adımdaki smoke test'in beklediği
      # bundle hash'ini doğrulamak hem de deploy özetindeki release ID'yi
      # elde etmek için diske yazılıyor. `shell: bash` ZORUNLU: pipefail
      # olmadan `firebase deploy` başarısız olsa bile `tee` başarılı olduğu
      # için adım YEŞİL görünürdü — bozuk bir production deploy'u sessizce
      # "başarılı" sayardı (bkz. kod denetimi).
      - name: Firebase Hosting'e Deploy Et
        shell: bash
        run: firebase deploy --only hosting --non-interactive --json | tee hosting-deploy-result.json

      # Bozuk bir deploy'un sessizce production'da kalmasını önlemek için
      # erken uyarı: hosting statik bir SPA servis ettiğinden (server.js /
      # /api/health yalnızca LOKAL `npm run dev`/`start` içindir, bu Firebase
      # Hosting deploy'unda hiç çalışmıyor) sağlık kontrolü hem kök sayfanın
      # HTTP 200 dönüp dönmediğine hem de servis edilen HTML'in TAM OLARAK bu
      # koşunun build'ine ait ana bundle hash'ini içerip içermediğine bakar —
      # yalnızca `id="root"` aramak eski/bayat bir release'i de geçirirdi.
      # `shell: bash` burada zorunlu: varsayılan GitHub Actions bash kabuğu
      # `-e` ile koşar ama `pipefail` YOKTUR, bu yüzden `$(cmd)` bir boru
      # içinde başarısız olsa bile `$?` yanlış okunabiliyordu (bkz. kod
      # denetimi: önceki `if [ $? -ne 0 ]` dalı `curl -f` başarısızlığında hiç
      # tetiklenmiyordu çünkü `set -e` zaten komut ikamesinin başarısız
      # olduğu satırda kabuğu durduruyordu). Otomatik rollback KASITLI olarak
      # eklenmedi (yanlış bir rollback daha kötü olabilir) — bu adım yalnızca
      # job'ı FAILED yapıp görünürlük sağlar; gerekirse elle geri almak için:
      # `firebase hosting:releases:list --project muftim` ile önceki release'i
      # bulup `firebase hosting:clone muftim:<ONCEKI_RELEASE_ID> muftim:live`
      # çalıştırın (bkz. kod denetimi).
      - name: Deploy Sonrası Sağlık Kontrolü (Smoke Test)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://muftim.web.app"
          # `|| true`: pipefail altında grep hiçbir şey bulamazsa (exit 1) pipe
          # başarısız sayılır ve `set -e` bir sonraki satırdaki dostane hata
          # mesajına hiç ulaşmadan script'i keser — bu, o erken çıkışı önler.
          EXPECTED_BUNDLE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1 || true)
          if [ -z "$EXPECTED_BUNDLE" ]; then
            echo "::error::dist/index.html içinde beklenen ana bundle deseni (assets/index-*.js) bulunamadı — smoke test yanlış build'e karşı koşuyor olabilir."
            exit 1
          fi
          echo "Bekleniyor: $EXPECTED_BUNDLE"

          ATTEMPT=1
          MAX_ATTEMPTS=5
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Kontrol ediliyor ($ATTEMPT/$MAX_ATTEMPTS): $URL"
            if BODY=$(curl -sf --retry 3 --retry-delay 5 -H 'Cache-Control: no-cache' "$URL/?cb=$GITHUB_SHA"); then
              if ! echo "$BODY" | grep -q 'id="root"'; then
                echo "::error::Deploy edilen sayfa beklenen SPA kök elemanını (id=\"root\") içermiyor — bozuk bir build yayınlanmış olabilir. Elle rollback için: 'firebase hosting:releases:list --project muftim' ardından 'firebase hosting:clone muftim:<ONCEKI_RELEASE_ID> muftim:live'"
                exit 1
              fi
              if echo "$BODY" | grep -qF "$EXPECTED_BUNDLE"; then
                echo "Sağlık kontrolü başarılı — yayındaki sayfa bu koşunun build'ine ait."
                exit 0
              fi
              echo "Yayındaki sayfa henüz bu koşunun bundle'ını yansıtmıyor (CDN yayılma payı olabilir)."
            else
              echo "İstek başarısız oldu."
            fi
            ATTEMPT=$((ATTEMPT + 1))
            # `|| true`: son denemeden sonra bu test false dönüp `set -e`
            # altında script'i döngü/`done`'a hiç ulaşmadan keser — bu, sondaki
            # `::error::` mesajının hiç yazdırılmamasına yol açardı.
            [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ] && sleep 5 || true
          done

          echo "::error::Deploy sonrası $URL adresinde $MAX_ATTEMPTS denemede beklenen bundle ($EXPECTED_BUNDLE) doğrulanamadı — eski/kısmi bir release servis ediliyor olabilir. Elle rollback için: 'firebase hosting:releases:list --project muftim' ardından 'firebase hosting:clone muftim:<ONCEKI_RELEASE_ID> muftim:live'"
          exit 1

      # Best-effort özet: `--json` biçimi beklenmedik şekilde değişirse bu
      # adım deploy'u KIRMAZ (`|| true`) — özet eksik kalır ama pipeline yeşil
      # kalmaya devam eder.
      - name: Deploy Özeti
        if: always()
        run: |
          {
            echo "## 🚀 Firebase Deploy Özeti"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Uygulama Sürümü | $(node -p "require('./package.json').version") |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Commit Mesajı | $(git log -1 --pretty=%s) |"
            echo "| Hosting URL | https://muftim.web.app |"
            RELEASE_ID=$(jq -r '.result.hosting // empty' hosting-deploy-result.json 2>/dev/null || true)
            if [ -n "$RELEASE_ID" ]; then
              echo "| Hosting Release | \`$RELEASE_ID\` |"
              echo ""
              echo "Elle rollback: \`firebase hosting:releases:list --project muftim\` ile önceki release'i bulup \`firebase hosting:clone muftim:<ONCEKI_RELEASE_ID> muftim:live\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ─── 4. Pull Request Preview Deploy ────────────────────────────────────────
  preview:
    name: PR Preview Deploy
    runs-on: ubuntu-latest
    # Bkz. deploy job'ındaki aynı gerekçe: build artık quality/security ile
    # paralel koşuyor, kapı burada tekrar zorunlu kılınıyor.
    needs: [security, quality, build, performance]
    # Yalnızca AYNI repodan açılan PR'lar: fork PR'larında `secrets.*` boş
    # gelir ve `id-token: write` de verilmez, WIF adımı anlamsız bir hatayla
    # düşerdi. (Eski --token düzeninde de fork PR'ları aynı sebeple
    # kırılıyordu, sadece hata mesajı farklıydı.)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      # PR'a preview URL'iyle sticky yorum bırakmak için (bkz. son adım).
      # `preview` yalnızca aynı repodan açılan PR'larda koşuyor (üstteki if),
      # bu yüzden token'ın yazma yetkisi garanti.
      pull-requests: write

    steps:
      - name: Kodu İndir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Artifaktını İndir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # Bkz. deploy job'ındaki aynı adımın gerekçesi (WIF, anahtarsız).
      - name: GCP Kimlik Doğrulama (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Bkz. deploy job'ındaki aynı adımın gerekçesi (pinli sürüm + cache).
      - name: firebase-tools Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: firebase-tools-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Firebase CLI Kur
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      # PR başına otomatik preview kanalı oluşturur (ücretsiz Firebase Hosting
      # özelliği) — kanal adı PR numarasına sabitlenir ki aynı PR'a yapılan
      # sonraki push'lar aynı kanalı güncellesin, her seferinde yeni kanal
      # açmasın. 7 gün sonra otomatik silinir. `--json` çıktısı bir sonraki
      # adımda PR yorumu için URL'i ayıklamak amacıyla diske yazılıyor.
      # `shell: bash` ZORUNLU: bkz. deploy job'ındaki "Firebase Hosting'e
      # Deploy Et" adımının aynı gerekçesi (pipefail olmadan `tee` deploy
      # hatasını maskeler).
      - name: Firebase Preview Channel Deploy
        shell: bash
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --non-interactive --json | tee preview-deploy-result.json

      # Best-effort: `--json` biçimi beklenmedik şekilde değişirse bu adım
      # SESSİZCE atlanır (`|| true`) — preview deploy'unun kendisi zaten
      # önceki adımda tamamlandı, PR yorumu yalnızca bir kolaylık.
      - name: Preview URL'ini Özete ve PR Yorumuna Yaz
        if: always()
        run: |
          PREVIEW_URL=$(jq -r '.result | to_entries[0].value.url // empty' preview-deploy-result.json 2>/dev/null || true)
          if [ -n "$PREVIEW_URL" ]; then
            echo "## 🔍 PR Preview" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        id: preview_url
        shell: bash

      - name: PR'a Sticky Yorum Bırak
        if: always() && steps.preview_url.outputs.preview_url != ''
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const previewUrl = '${{ steps.preview_url.outputs.preview_url }}';
            const marker = '<!-- makam-preview-deploy-comment -->';
            const body = `${marker}\n### 🔍 PR Preview\n\n${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
