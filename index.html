<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Tema class'ını ilk boyamadan önce senkron uygula — React/Zustand
      // mount olana kadar bekleseydi her yüklemede yanlış temayla bir anlık
      // "flaş" (FOUC) yaşanırdı. Kaynak: uiStore'un persist ettiği
      // 'makam-ui-settings' anahtarı (bkz. src/store/uiStore.ts).
      (function () {
        try {
          var stored = localStorage.getItem('makam-ui-settings');
          var theme = stored ? JSON.parse(stored).state.theme : 'system';
          var resolved = theme === 'dark' || theme === 'light'
            ? theme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/makam-logo.svg" />
    <link rel="apple-touch-icon" href="/makam-logo-192.png" />
    <meta property="og:title" content="MAKAM | Stratejik Yönetim" />
    <meta property="og:description" content="MAKAM: Stratejik Hedef Takip ve Yönetim Makamı" />
    <meta property="og:image" content="/makam-logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A09" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAKAM" />
    <meta name="application-name" content="MAKAM" />
    <meta name="msapplication-TileColor" content="#0A0A09" />
    <meta name="description" content="MAKAM: Stratejik Hedef Takip ve Yönetim Makamı" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fontlar artık self-hosted (bkz. src/index.css @font-face — tasarım
         denetimi F29): eskiden fonts.googleapis.com'a senkron bir <link>
         ilk boyamayı bloke eden ayrı bir üçüncü taraf zinciri (preconnect +
         stylesheet + font dosyaları) oluşturuyordu. Yalnızca Inter (gövde
         fontu, site genelinde en hemen görünen metin) preload edilir —
         Outfit/JetBrains Mono normal @font-face keşfiyle, bloklamadan yüklenir. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <title>MAKAM | Stratejik Yönetim</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
